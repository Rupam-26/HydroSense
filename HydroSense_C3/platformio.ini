; ============================================================
; HYDROSENSE ESP32-C3 PLATFORMIO PROJECT
;
; Copyright (c) 2026 Rupam Mondal
;
; This configuration pins the platform and library versions so
; the firmware can be rebuilt consistently on another computer.
; ============================================================

[platformio]
default_envs = esp32-c3-devkitm-1

; ============================================================
; ESP32-C3 FIRMWARE ENVIRONMENT
; ============================================================

[env:esp32-c3-devkitm-1]

; PlatformIO Espressif32 platform.
;
; Version 6.12.0 provides:
; - Arduino-ESP32 Core 2.0.17
; - ESP-IDF 4.4.7
;
; These match the Arduino/ESP-IDF generation recorded in the
; existing HydroSense C3 build metadata.
platform = espressif32@6.12.0

; The ESP32-C3-DevKitM-1 definition is retained because this is
; the proven PlatformIO board configuration for this firmware.
board = esp32-c3-devkitm-1

framework = arduino

; ============================================================
; SERIAL MONITOR
; ============================================================

monitor_speed = 115200

; Show timestamps and decode ESP32 exception backtraces in the
; PlatformIO Serial Monitor.
monitor_filters =
    time
    colorize
    esp32_exception_decoder

; ============================================================
; FIRMWARE UPLOAD
; ============================================================

; Retain the upload speed used by the working C3 project.
upload_speed = 921600

; ============================================================
; USB CONFIGURATION
;
; Enable the ESP32-C3 native USB CDC Serial interface at boot.
; ============================================================

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ============================================================
; PINNED PROJECT DEPENDENCIES
;
; PlatformIO downloads these automatically. The generated
; dependency copies inside .pio must not be committed.
; ============================================================

lib_deps =
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.6
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit SH110X@2.1.15