; ============================================================
; HYDROSENSE ESP32-S3 PLATFORMIO PROJECT
; ============================================================

[platformio]
default_envs = waveshare_esp32_s3_lcd_1_9

; ============================================================
; WAVESHARE ESP32-S3-LCD-1.9
; ============================================================

[env:waveshare_esp32_s3_lcd_1_9]

; Pinned for reproducible builds.
platform = espressif32@6.12.0

; Custom definition stored in:
; boards/waveshare_esp32_s3_lcd_1_9.json
board = waveshare_esp32_s3_lcd_1_9

framework = arduino

; ============================================================
; SERIAL MONITOR
; ============================================================

monitor_speed = 115200

monitor_filters =
    time
    colorize
    esp32_exception_decoder

; ============================================================
; FIRMWARE UPLOAD
; ============================================================

upload_speed = 921600

; ============================================================
; USB CONFIGURATION
; ============================================================

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ============================================================
; PINNED PROJECT DEPENDENCIES
; ============================================================

lib_deps =
    moononournation/GFX Library for Arduino@1.4.9