name: HydroSense Backend CI

"on":
  push:
    branches:
      - main
    paths:
      - "HydroSense_Backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    paths:
      - "HydroSense_Backend/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: HydroSense_Backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: HydroSense_Backend/package-lock.json

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run JavaScript checks and tests
        run: npm run check

      - name: Audit production Node.js dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: HydroSense_Backend/tools/ml_requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r tools/ml_requirements.txt

      - name: Check Python tools
        run: |
          python -m py_compile tools/hydrosense_baseline.py
          python -m py_compile tools/isolation_worker.py
          python -m py_compile tools/train_isolation_forest_web.py
